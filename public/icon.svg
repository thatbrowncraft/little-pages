<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".18"/>
    </filter>
    <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#F6EFE3"/>
      <circle cx="3" cy="5" r=".8" fill="#E8D9C2" opacity=".35"/>
      <circle cx="13" cy="12" r=".7" fill="#E8D9C2" opacity=".28"/>
    </pattern>
  </defs>

  <!-- warm paper background -->
  <rect width="512" height="512" rx="72" fill="#F6EFE3"/>
  <rect x="18" y="18" width="476" height="476" rx="60" fill="url(#paper)" stroke="#E3D1B5" stroke-width="3"/>

  <!-- notebook -->
  <g filter="url(#shadow)">
    <rect x="112" y="82" width="300" height="350" rx="34" fill="#E8D9C2"/>
    <rect x="96" y="70" width="300" height="350" rx="34" fill="#FFF9EE" stroke="#7B4F2A" stroke-width="6"/>
    <rect x="112" y="86" width="268" height="318" rx="24" fill="none" stroke="#C8A979" stroke-width="3" stroke-dasharray="10 9"/>
  </g>

  <!-- page lines -->
  <g stroke="#D9CDBA" stroke-width="5" stroke-linecap="round" opacity=".8">
    <line x1="170" y1="190" x2="340" y2="190"/>
    <line x1="170" y1="225" x2="340" y2="225"/>
    <line x1="170" y1="260" x2="340" y2="260"/>
    <line x1="170" y1="295" x2="320" y2="295"/>
  </g>

  <!-- washi tape -->
  <g transform="rotate(-2 250 78)">
    <rect x="205" y="61" width="112" height="38" rx="7" fill="#C7A66A"/>
    <path d="M215 68h92M215 78h92M215 88h92" stroke="#E8D9C2" stroke-width="3" opacity=".45"/>
  </g>

  <!-- spiral binding -->
  <g fill="none" stroke="#5A3A23" stroke-width="9" stroke-linecap="round">
    <path d="M105 118c-34 0-34 34 0 34"/>
    <path d="M105 166c-34 0-34 34 0 34"/>
    <path d="M105 214c-34 0-34 34 0 34"/>
    <path d="M105 262c-34 0-34 34 0 34"/>
    <path d="M105 310c-34 0-34 34 0 34"/>
    <path d="M105 358c-34 0-34 34 0 34"/>
  </g>

  <!-- botanical sprig -->
  <g fill="none" stroke="#80613A" stroke-width="6" stroke-linecap="round">
    <path d="M270 365c25-42 45-78 78-111"/>
  </g>
  <g fill="#B38A4A">
    <ellipse cx="292" cy="338" rx="10" ry="22" transform="rotate(-42 292 338)"/>
    <ellipse cx="310" cy="309" rx="10" ry="22" transform="rotate(35 310 309)"/>
    <ellipse cx="327" cy="283" rx="10" ry="22" transform="rotate(-42 327 283)"/>
    <ellipse cx="346" cy="260" rx="10" ry="22" transform="rotate(35 346 260)"/>
    <ellipse cx="278" cy="351" rx="9" ry="19" transform="rotate(35 278 351)"/>
  </g>

  <!-- heart -->
  <path d="M350 365
           C330 342 296 358 302 382
           C308 405 350 424 350 424
           C350 424 392 405 398 382
           C404 358 370 342 350 365Z"
        fill="#6B3E28"/>
</svg>