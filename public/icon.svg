<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="100" fill="#F5F2ED"/>
  <!-- Outer notebook border -->
  <rect x="40" y="40" width="432" height="432" rx="36" fill="#FFFDF9" stroke="#D9CDBA" stroke-width="8"/>
  <!-- Ruled stationery lines -->
  <line x1="80" y1="140" x2="432" y2="140" stroke="#EAE4D9" stroke-width="6"/>
  <line x1="80" y1="200" x2="432" y2="200" stroke="#EAE4D9" stroke-width="6"/>
  <line x1="80" y1="260" x2="432" y2="260" stroke="#EAE4D9" stroke-width="6"/>
  <line x1="80" y1="320" x2="432" y2="320" stroke="#EAE4D9" stroke-width="6"/>
  <line x1="80" y1="380" x2="432" y2="380" stroke="#EAE4D9" stroke-width="6"/>
  <!-- Red margin line -->
  <line x1="130" y1="40" x2="130" y2="472" stroke="#E59A9A" stroke-width="4" stroke-dasharray="8 6" opacity="0.6"/>
  <!-- Washi Tape decorative element -->
  <rect x="180" y="24" width="152" height="36" rx="4" fill="#C6A969" opacity="0.85" transform="rotate(-2 256 42)"/>
  <!-- Book / Feather Journal Motif -->
  <g transform="translate(196, 170) scale(1.5)" fill="none" stroke="#4A3728" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
    <path d="M12 6h4"/>
    <path d="M12 10h4"/>
  </g>
  <!-- Text branding "LP" -->
  <text x="256" y="430" text-anchor="middle" font-family="serif" font-style="italic" font-weight="bold" font-size="32" fill="#4A3728">Little Pages</text>
</svg>
